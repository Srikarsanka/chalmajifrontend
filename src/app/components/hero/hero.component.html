<section class="hero-section" id="hero">
  <!-- Video Background -->
  <div class="hero-video-wrapper">
    <video class="hero-video" src="https://res.cloudinary.com/djha4r2ys/video/upload/v1787667357/Generating_brand_film_from_story__202608251929_crd3tx.mp4" autoplay
      [muted]="true" loop playsinline></video>
    <div class="hero-overlay"></div>
  </div>

  <!-- Hero Content -->
  <div class="hero-content">
    <div class="hero-text-wrapper">
      <p class="hero-subtitle">ARCHITECTURAL EXCELLENCE · VISAKHAPATNAM</p>
      <h1 class="hero-title">
        <span class="title-line">Crafting Exceptional</span>
        <span class="title-line italic">Living Spaces</span>
      </h1>
      <p class="hero-desc">
        Four decades of visionary master developments, iconic coastal high-rises, and enduring plotted communities.
      </p>
      <div class="hero-btn-group">
        <a routerLink="/projects" class="theme-btn">
          <span class="btn-text">Explore Projects</span>
          <i class="fa-solid fa-arrow-right btn-arrow"></i>
        </a>
        <a routerLink="/connect" class="theme-btn hero-btn-secondary">
          <span class="btn-text">Connect With Us</span>
          <i class="fa-solid fa-compass btn-arrow"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Scroll Down Indicator -->
  <div class="scroll-indicator">
    <div class="scroll-line"></div>
    <span class="scroll-text">Scroll</span>
  </div>
</section>
