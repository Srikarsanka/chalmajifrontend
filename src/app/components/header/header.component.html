<header class="main-header" [class.scrolled]="isScrolled" [class.projects-header]="isProjectsPage" *ngIf="!isAboutPage && !isAdminPage">
  <nav class="navbar" [class.fixed-top]="isScrolled" [class.dark-nav]="isLightPage && !isScrolled" [class.projects-nav]="isProjectsPage">
    <div class="nav-container">
      <!-- Logo -->
      <a routerLink="/" class="nav-logo" (click)="closeMenu()">
        <img [src]="isScrolled ? '/assets/images/logo-dark.png' : (isLightPage ? '/assets/images/logo-dark.png' : '/assets/images/logo.png')" alt="Chalamaji Infra Projects" class="logo-img">
      </a>

      <!-- Hamburger -->
      <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen" aria-label="Toggle Menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </nav>

  <!-- Off-Canvas Menu -->
  <div class="offcanvas-overlay" [class.active]="isMenuOpen" (click)="closeMenu()"></div>
  <div class="offcanvas-menu" [class.active]="isMenuOpen">
    <div class="offcanvas-header">
      <button class="close-btn" (click)="closeMenu()" aria-label="Close Menu">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav-links">
        <li><a routerLink="/" (click)="closeMenu()">Home</a></li>
        <li><a routerLink="/about" (click)="closeMenu()">About</a></li>
        <li><a routerLink="/projects" (click)="closeMenu()">Projects</a></li>
        <li><a routerLink="/connect" (click)="closeMenu()">Connect</a></li>
      </ul>

      <!-- Ongoing Projects Section -->
      <div class="offcanvas-projects" *ngIf="ongoingProjects.length > 0">
        <p class="section-label">
          <span>Ongoing Projects</span>
          <span class="pulse-indicator"></span>
        </p>
        <ul class="sidebar-project-list">
          <li *ngFor="let proj of ongoingProjects">
            <a [routerLink]="['/projects', proj.id]" (click)="closeMenu()" class="sidebar-project-item">
              <span class="project-name">{{ proj.name }}</span>
              <span class="project-loc"><i class="fa-solid fa-location-dot"></i> {{ proj.location }}</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="offcanvas-contact">
        <p class="contact-label">Get In Touch</p>
        <a href="tel:+919257925788" class="contact-link">+91 92579 25788</a>
        <a
          href="https://wa.me/919257925788?text=Hi%2C%20I%20would%20like%20to%20know%20more%20about%20your%20projects."
          target="_blank"
          rel="noopener noreferrer"
          class="contact-link"
        ><i class="fa-brands fa-whatsapp"></i> Chat on WhatsApp</a>
        <a href="mailto:info&#64;chalamaji.com" class="contact-link">info&#64;chalamaji.com</a>
      </div>
      <div class="offcanvas-social">
        <a
          href="https://wa.me/919257925788?text=Hi%2C%20I%20would%20like%20to%20know%20more%20about%20your%20projects."
          target="_blank"
          rel="noopener noreferrer"
          aria-label="WhatsApp"
        ><i class="fa-brands fa-whatsapp"></i></a>
        <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </div>
  </div>
</header>
