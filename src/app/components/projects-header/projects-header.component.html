<section class="projects-intro" [class.visible]="isVisible">
  <div class="intro-container">

    <!-- Left Column: Copy -->
    <div class="intro-copy">
      <p class="intro-eyebrow">Our Portfolio</p>
      <h2 class="intro-headline">Every Address,<br>A Different Story</h2>
      <div class="headline-rule"></div>
      <p class="intro-body">
        From prime plotted communities to distinguished residential homes, apartments, and villas — every Chalamaji project is designed around
        how you actually want to live. Explore the spaces we've built, and the
        ones still taking shape.
      </p>
      <div class="filter-pills">
        <button
          *ngFor="let f of filters"
          class="filter-pill"
          [class.active]="activeFilter === f.value"
          (click)="setFilter(f.value)">
          {{ f.label }}
        </button>
      </div>
    </div>

    <!-- Right Column: Visual Strip -->
    <div class="intro-visuals">
      <div class="visual-strip">
        <div
          *ngFor="let img of images; let i = index"
          class="strip-image-wrap"
          [class.active]="activeImageIndex === i"
          (click)="setActiveImage(i)">
          <img [src]="img.src" [alt]="img.alt" class="strip-image">
          <div class="strip-overlay"></div>
          <span class="strip-label">{{ img.label }}</span>
        </div>
      </div>
      <!-- Image indicators -->
      <div class="strip-indicators">
        <button
          *ngFor="let img of images; let i = index"
          class="indicator-dot"
          [class.active]="activeImageIndex === i"
          (click)="setActiveImage(i)"
          [attr.aria-label]="'View ' + img.label">
        </button>
      </div>
    </div>

  </div>
</section>
